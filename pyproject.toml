[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firefox-vrt"
version = "0.1.0"
description = "Web tool for diffing Firefox chrome screenshots fetched from Mozilla CI"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "Pillow>=10.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# Local drawWindow chrome capture (Marionette-driven). Not needed by the web app
# itself, which only diffs already-captured screenshots.
capture = [
    "marionette-driver>=3.7",
    "mozrunner>=8.4",
    "mozprofile>=3.0",
]

[tool.setuptools.packages.find]
include = ["firefox_vrt*"]

[tool.setuptools.package-data]
firefox_vrt = [
    "data/*.json",
    "templates/*.html",
    "templates/partials/*.html",
    "static/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
